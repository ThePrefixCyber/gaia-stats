<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gaia Stats plot</title><style>body{margin:0;font:15px/1.5 system-ui;background:#edf0ef;color:#26313a}header{padding:12px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}button,a{font:inherit;color:#185888}button{cursor:pointer;background:white;border:1px solid #a2abae;border-radius:4px;padding:6px 12px}iframe{width:100%;height:78vh;border:0;background:white}details{padding:12px 20px}#status{padding:0 20px}</style><header><a href="/classic/">Gaia Project Stats</a><strong id="title">Original statistics</strong><button id="full">Fullscreen</button><a id="download">Download</a><button id="copy">Copy Embed Link</button></header><p id="status" role="status"></p><iframe id="plot" title="Gaia Project statistical plot"></iframe><details><summary>About this plot</summary><p id="help"></p><p>Original base-game calculations by Timothy Gladyshev. These comparisons describe observed games, not causal effects or proven optimal strategies.</p></details><script>
const query=new URLSearchParams(location.search);const el=id=>document.getElementById(id);const descriptions={'advanced-tech-frequency':'Advanced technology frequency and resulting rank distribution. Games with dropped players are excluded.','advanced-tech-score':'Average bid-adjusted score by advanced technology and research-track position, with the original score threshold of at least 130.','basic-tech-frequency':'Basic technology frequency and resulting rank distribution. Games with dropped players are excluded.','basic-tech-score':'Average bid-adjusted score by basic technology and research-track position, preserving the original averaging convention.','round-one-structures':'Structure-count treemap. Area shows frequency; color shows average score. The original score and lower-quantile exclusions are preserved.','round-scoring':'Round-scoring point averages and change in observed victory probability, using the original matrix and scoring-combination calculation.','final-scoring':'Final-scoring pair preferences: points relative to the original baseline and change in observed victory probability.','point-sources':'Distribution of bid-adjusted score proportions by VP source and finishing rank, for scores strictly above 100.'};
if(query.has('plot_src')){const aliases={'adv_techs_analysis/taken_freq':'advanced-tech-frequency','adv_techs_analysis/pos_on_score':'advanced-tech-score','base_tech_analysis/taken_freq':'basic-tech-frequency','base_tech_analysis/pos_on_score':'basic-tech-score','r1_structs_analysis/freq_and_score':'round-one-structures','final_scoring/heatmap_v1':'final-scoring','round_scoring/heatmap_v1':'round-scoring','scoring/dist_on_pos':'point-sources'};const m=new URL(query.get('plot_src'),location.origin).pathname.match(/^\/([234])p\/(.+)\/([a-z-]+)\.html$/);query.delete('plot_src');query.delete('plot_des');if(m&&aliases[m[2]]){query.set('players',m[1]);query.set('plot',aliases[m[2]]);query.set('faction',m[3]);}}
const kind=query.get('plot');const src='/classic/plot?'+query;el('title').textContent=(query.get('players')||'?')+' players · '+(query.get('faction')||'?');el('help').textContent=descriptions[kind]||'Unknown plot selection.';el('plot').src=src;el('download').href=src+'&download=1';el('download').download='gaia-base-plot.html';el('full').onclick=()=>el('plot').requestFullscreen().catch(()=>{el('status').textContent='Fullscreen is unavailable in this browser.';});el('copy').onclick=()=>navigator.clipboard.writeText(new URL(src,location.origin).href).then(()=>{el('status').textContent='Embed link copied.';}).catch(()=>{el('status').textContent='Copy this link: '+new URL(src,location.origin).href;});
</script></html>
