[Service]
Environment=GAIA_RELEASE_ROOT=/var/lib/gaia-stats/releases-store
Environment=GAIA_CLASSIC_CACHE=/var/lib/gaia-stats/classic-cache
ExecStart=
ExecStart=/opt/gaia-stats/.venv/bin/gunicorn gaia_stats.wsgi:create_app() --bind 127.0.0.1:8000 --workers 1 --threads 4 --timeout 90 --access-logfile - --error-logfile -
MemoryHigh=1500M
MemoryMax=1800M
